<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e4a40">
  <title>Choose a New Password | URWA Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <style>
    body{font-family:'DM Sans',sans-serif;background:#fbf6e9;color:#153b34;min-height:100vh;display:grid;place-items:center;padding:24px}
    .auth-card{width:min(100%,460px);background:#fff;border:1px solid #e3f0ea;border-radius:20px;padding:36px;box-shadow:0 16px 48px rgba(14,74,64,.09)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;color:#0e4a40;text-decoration:none;font-weight:800}
    .brand img{width:52px;height:52px;object-fit:contain}
    h1{font-size:1.65rem;margin:0 0 10px;color:#0e4a40}
    p{line-height:1.65;color:#5e6d68}
    label{display:block;font-weight:700;margin:20px 0 8px}
    input{width:100%;padding:13px 14px;border:1px solid #d4e1db;border-radius:10px;font:inherit}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#0e4a40;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .back{display:block;text-align:center;margin-top:22px;color:#0e4a40;font-weight:700;text-decoration:none}
    [data-auth-message]{overflow-wrap:anywhere}
  </style>
</head>
<body>
  <main class="auth-card">
    <a class="brand" href="../../index.html"><img src="../../assets/logo.jpg" alt="URWA logo"><span>URWA<br><small>The Firmest Handhold</small></span></a>
    <h1>Choose a new password</h1>
    <p>Use at least 8 characters. Once updated, return to the appropriate URWA sign-in page.</p>
    <form id="studentResetPasswordForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirmNewPassword">Confirm new password</label>
      <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit">Update password</button>
    </form>
    <a class="back" href="../../index.html">← Back to URWA website</a>
  </main>
  <script type="module" src="../../js/firebase-auth.js"></script>
</body>
</html>
